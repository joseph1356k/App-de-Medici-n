name: release

# Publica una versión descargable con UN enlace fijo, sin tener que rebuscar en Actions:
#   https://github.com/joseph1356k/App-de-Medici-n/releases/latest/download/Medidor.exe
#
# Se dispara al empujar una etiqueta vN.N.N:  git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  # También a mano, desde la pestaña Actions: útil cuando quien publica no puede empujar
  # etiquetas (un entorno con el git filtrado, por ejemplo).
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, p. ej. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      # No se publica nada que no pase el contrato del instrumento.
      - run: dotnet run -c Release --project medidor/Contrato

      # Un .exe publicado SIN clave se instala igual y falla en cada PC del hospital, uno por uno,
      # con la persona delante. Eso no se descubre en el CI: se descubre en el sexto computador.
      # Aquí se corta antes, con el motivo escrito.
      - name: Exigir la clave del servidor
        env:
          MEDIDOR_CLAVE: ${{ secrets.MEDIDOR_CLAVE }}
        run: |
          if [ -z "$MEDIDOR_CLAVE" ]; then
            echo "::error::Falta el secreto MEDIDOR_CLAVE del repositorio. Sin él, el Medidor.exe"
            echo "::error::publicado sale sin clave y no puede instalarse con doble clic."
            echo "::error::Ponlo en Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Clave presente (${#MEDIDOR_CLAVE} caracteres)."

      # La clave del servidor entra AQUÍ, desde el secreto del repo, nunca desde el código. Es lo
      # que hace que el .exe publicado se instale con un doble clic, sin teclear nada.
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:MedidorClavePorDefecto="$MEDIDOR_CLAVE" -o salida medidor/App/App.csproj
        env:
          MEDIDOR_CLAVE: ${{ secrets.MEDIDOR_CLAVE }}
      - run: |
          rm -f salida/*.pdb
          cp medidor/instalar.ps1 medidor/desinstalar.ps1 salida/

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          [ -z "$TAG" ] && TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            salida/Medidor.exe salida/instalar.ps1 salida/desinstalar.ps1 \
            --title "Medidor $TAG" \
            --notes "**Descarga \`Medidor.exe\`, haz doble clic, y ya.** Se instala solo, arranca con Windows y empieza a medir.

          No necesita permisos de administrador ni tener .NET instalado. Se vigila a sí mismo: si se cierra vuelve solo en menos de 5 minutos. Aparece un círculo junto al reloj de Windows: ámbar = falta asignarle el consultorio en el panel (Dispositivos), verde = midiendo en su consultorio.

          Para quitarlo, \`desinstalar.ps1\`. Para apuntar a otro servidor, \`instalar.ps1 -Servidor ... -Clave ...\`.

          Pasos completos en [docs/INSTALAR.md](https://github.com/joseph1356k/App-de-Medici-n/blob/main/docs/INSTALAR.md)."
